name: Update database

# Run by hand only (Actions tab, "Update database", Run workflow). It applies the missing
# files in db/migrations to the preview or live Neon database. Steps: docs/database-updates.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [preview, production]
        default: preview
      action:
        description: check only lists what is missing, apply makes the changes
        type: choice
        options: [check, apply]
        default: check
      confirm:
        description: To apply to production, type PRODUCTION
        type: string
        required: false

permissions:
  contents: read

# Never two updates at once, and never cut one off half way.
concurrency:
  group: update-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update the database
        run: node scripts/update-database.mjs
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          PREVIEW_DATABASE_URL: ${{ inputs.target == 'preview' && secrets.PREVIEW_DATABASE_URL || '' }}
          PRODUCTION_DATABASE_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_DATABASE_URL || '' }}
